<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planeja</title>
  <meta name="description" content="Organizador de tarefas com quadro, calendário de entregas, automações e alertas de prazo.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="30" height="30">
        <span>Planeja</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="board"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4zM10 4h5v10h-5zM16 4h4v7h-4z"/></svg><span>Quadro</span></button>
        <button class="nav-item" data-view="list"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Prazos</span></button>
        <button class="nav-item" data-view="calendar"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Calendário</span></button>
        <button class="nav-item" data-view="automations"><svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg><span>Automações</span></button>
        <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg><span>Ajustes</span></button>
      </nav>
      <div class="side-section">
        <div class="side-title">Tags <button class="link-btn" id="manageTags">editar</button></div>
        <div id="sideTags" class="side-tags"></div>
      </div>
      <div class="side-foot" id="sideStats"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Quadro</h1>
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
            <input id="search" type="search" placeholder="Buscar tarefas" autocomplete="off">
          </label>
          <select id="filterPriority" aria-label="Filtrar por prioridade">
            <option value="">Todas as prioridades</option>
            <option value="urgent">Urgente</option>
            <option value="high">Alta</option>
            <option value="medium">Média</option>
            <option value="low">Baixa</option>
          </select>
          <label class="check-inline"><input type="checkbox" id="hideDone"> Ocultar concluídas</label>
          <button class="icon-btn" id="bellBtn" aria-label="Alertas de prazo">
            <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg>
            <span class="badge" id="bellCount" hidden>0</span>
          </button>
          <button class="btn primary" id="newTaskBtn"><span>+</span> Nova tarefa</button>
        </div>
      </header>
      <div class="active-filter" id="activeFilter" hidden></div>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Painel de alertas -->
  <div class="drawer" id="alertDrawer" hidden>
    <div class="drawer-head">
      <h2>Alertas de prazo</h2>
      <button class="icon-btn" data-close="alertDrawer" aria-label="Fechar">✕</button>
    </div>
    <div id="alertList" class="alert-list"></div>
  </div>

  <!-- Editor de tarefa -->
  <dialog id="taskDialog" class="dialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-head">
        <input id="fTitle" class="title-input" placeholder="Nome da tarefa" required autocomplete="off">
        <button type="button" class="icon-btn" id="closeTask" aria-label="Fechar">✕</button>
      </div>
      <div class="dialog-body">
        <div class="grid-2">
          <label class="field"><span>Coluna</span><select id="fColumn"></select></label>
          <label class="field"><span>Prioridade</span>
            <select id="fPriority">
              <option value="urgent">Urgente</option>
              <option value="high">Alta</option>
              <option value="medium">Média</option>
              <option value="low">Baixa</option>
            </select>
          </label>
          <label class="field"><span>Início</span><input type="date" id="fStart"></label>
          <div class="field"><span>Prazo de entrega</span>
            <div class="row"><input type="date" id="fDue"><input type="time" id="fTime" aria-label="Hora"></div>
          </div>
        </div>

        <div class="field"><span>Cor</span><div id="fColors" class="swatches"></div></div>

        <div class="field"><span>Tags</span><div id="fTags" class="tag-picker"></div></div>

        <div class="grid-2">
          <div class="field"><span>Repetir</span>
            <div class="row">
              <select id="fRecur">
                <option value="none">Não repete</option>
                <option value="daily">Diariamente</option>
                <option value="weekly">Semanalmente</option>
                <option value="monthly">Mensalmente</option>
                <option value="yearly">Anualmente</option>
              </select>
              <label class="mini">a cada <input type="number" id="fInterval" min="1" max="99" value="1"></label>
            </div>
          </div>
          <label class="field"><span>Repetir até (opcional)</span><input type="date" id="fUntil"></label>
        </div>

        <div class="field"><span>Lembretes antes do prazo</span><div id="fReminders" class="chips"></div></div>

        <label class="field"><span>Descrição</span><textarea id="fNotes" rows="3" placeholder="Detalhes, links, contexto"></textarea></label>

        <div class="field"><span>Checklist <em id="checkProgress"></em></span>
          <ul id="fChecklist" class="checklist"></ul>
          <div class="row"><input id="fCheckNew" placeholder="Adicionar item e Enter" autocomplete="off"><button type="button" class="btn" id="fCheckAdd">Adicionar</button></div>
        </div>
        <p class="gcal-line" id="gcalLine"></p>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn danger ghost" id="deleteTask">Excluir</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="syncTask" title="Enviar para o Google Agenda">Enviar ao Google Agenda</button>
        <button type="submit" class="btn primary" id="saveTask">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmação genérica -->
  <dialog id="confirmDialog" class="dialog small">
    <form method="dialog">
      <div class="dialog-body"><p id="confirmText"></p></div>
      <div class="dialog-foot">
        <div class="spacer"></div>
        <button value="no" class="btn">Cancelar</button>
        <button value="yes" class="btn danger">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    // Ajustes da demonstração publicada: sem Google Agenda e sem downloads (a página não permite).
    connectGoogle = async function () { toast('Na demonstração, a conexão com o Google Agenda fica desligada. No app instalado, ela funciona.'); return false; };
    download = function () { toast('Na demonstração, os downloads ficam desligados. No app instalado, o arquivo é baixado.'); };
    setTimeout(function () { toast('Demonstração do Planeja: crie, arraste e conclua tarefas à vontade. Os dados ficam só neste navegador.'); }, 700);
  </script>
</body>
</html>
