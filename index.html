<style>
/* Layout: menu fixo · abertura em petróleo · projetos 2×2 com prévia · sobre/formação · contato */
:root{
  --bg:#f6f8f8; --paper:#ffffff; --ink:#15191c; --muted:#56626a; --line:#dbe3e6;
  --petrol:#0f4c5c; --petrol-dark:#0a3540; --on-petrol:#ffffff; --petrol-soft:#e2edf0; --tag:#0f4c5c;
  --build:#8a5a00; --build-bg:#fbf0d6; --live:#1d6b48; --live-bg:#dff1e7;
  --display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1214; --paper:#141b1e; --ink:#e5ecee; --muted:#9aa8ad; --line:#24323a;
    --petrol:#0c3e4b; --petrol-dark:#0a3540; --on-petrol:#f2f8f9; --petrol-soft:#16292f; --tag:#86c6d4;
    --build:#f0cf86; --build-bg:#3a2f14; --live:#7fd3a6; --live-bg:#163327; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:72px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--tag);outline-offset:3px}
h1,h2,h3{text-wrap:balance}

/* Menu */
.nav{position:sticky;top:0;z-index:20;background:var(--petrol);color:var(--on-petrol);border-bottom:1px solid rgba(255,255,255,.12)}
.nav .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:17px}
.brand i{font-style:normal;width:30px;height:30px;border:1px solid rgba(255,255,255,.4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.links{display:flex;align-items:center;gap:22px;font-size:14px}
.links a{text-decoration:none;opacity:.85}
.links a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:6px;overflow:hidden}
.seg button{font:500 12.5px var(--body);padding:5px 11px;border:0;background:transparent;color:var(--on-petrol);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--on-petrol);color:var(--petrol)}

/* Abertura */
.hero{background:var(--petrol);color:var(--on-petrol)}
.hero .inner{padding-block:44px 56px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.04;letter-spacing:-.015em;margin:0 0 18px}
.hero h1 em{font-style:italic}
.hero .intro{margin:0 0 22px;max-width:52ch;opacity:.9;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);text-decoration:none;border-radius:7px;padding:10px 16px;cursor:pointer;border:1px solid transparent}
.btn.light{background:var(--on-petrol);color:var(--petrol)}
.btn.ghost{border-color:rgba(255,255,255,.45);color:var(--on-petrol);background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.who{display:flex;flex-direction:column;gap:8px;font-size:15px;min-width:0}
.who strong{font-family:var(--display);font-weight:600;font-size:22px}
.who .role{opacity:.9}
.oab{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;opacity:.85}
.areas{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.areas span{font-size:12.5px;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px 11px}

main .inner{display:flex;flex-direction:column;gap:64px;padding-block:56px 72px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.4vw,34px);margin:0}
.sechead p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}

/* Projetos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.shot{display:block;aspect-ratio:16/10;background:var(--petrol-soft);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block;transition:transform .35s ease}
a.shot:hover img{transform:scale(1.025)}
.shot .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:28px;background:linear-gradient(135deg,var(--petrol),var(--petrol-dark));color:var(--on-petrol)}
.shot .ph b{font-family:var(--display);font-weight:600;font-size:26px}
.shot .ph code{font-family:var(--mono);font-size:13px;opacity:.85;line-height:1.8}
.card .body{padding:20px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.live{color:var(--live);background:var(--live-bg)}
.pill.build{color:var(--build);background:var(--build-bg)}
.pill.own{color:var(--tag);background:var(--petrol-soft)}
.card h3{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;margin:0}
.card .sub{color:var(--muted);margin:-6px 0 0;font-size:14.5px}
.card p{margin:0}
.hl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.hl li::marker{color:var(--tag)}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font-family:var(--mono);font-size:12px;background:var(--petrol-soft);color:var(--ink);padding:2px 8px;border-radius:4px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line)}
.foot small{color:var(--muted);font-size:12.5px;min-width:0;flex:1 1 200px}
.cta{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--body);text-decoration:none;color:var(--on-petrol);background:var(--petrol);border:1px solid var(--petrol);border-radius:7px;padding:8px 14px;white-space:nowrap}
.cta:hover{background:var(--petrol-dark)}
.cta.off{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
.cta svg{width:14px;height:14px}

/* Sobre */
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px}
.about p{margin:0 0 14px;max-width:62ch}
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.skillgroups{display:flex;flex-direction:column;gap:18px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills span{font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px}
.edu{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.edu li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.edu .y{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.edu b{display:block;font-weight:600}
.edu span{color:var(--muted);font-size:14px}

/* Contato */
.contact{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center}
.contact .item{display:flex;flex-direction:column;gap:2px;min-width:0}
.contact .v{font-size:16px;overflow-wrap:anywhere}
.copy{font:500 13px var(--body);padding:7px 14px;border-radius:6px;border:1px solid var(--petrol);background:var(--petrol);color:var(--on-petrol);cursor:pointer}
.contact a{color:var(--tag);font-weight:500}
.fine{font-size:13px;color:var(--muted);margin:16px 0 0;max-width:72ch}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 16px 32px}

@media (max-width:860px){
  .hero .inner,.about{grid-template-columns:minmax(0,1fr);gap:28px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .links a{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}

};

let lang = 'pt';
try { const s = localStorage.getItem('pf-lang'); if (s === 'en' || s === 'pt') lang = s; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const ext = url => /^https?:/.test(url) ? ' target="_blank" rel="noopener"' : '';

function shot(p) {
  const url = LINKS[p.id], img = SHOTS[p.id];
  const inner = img
    ? `<img src="${img}" alt="${esc(p.t)}" loading="lazy" width="960" height="600">`
    : `<div class="ph"><b>${esc(p.t)}</b><code>${p.hl.map(esc).join('<br>')}</code></div>`;
  return url ? `<a class="shot" href="${esc(url)}"${ext(url)} tabindex="-1" aria-hidden="true">${inner}</a>` : `<div class="shot">${inner}</div>`;
}
function cta(p, d) {
  const url = LINKS[p.id];
  if (!url) return `<span class="cta off">${esc(d.soon)}</span>`;
  return `<a class="cta" href="${esc(url)}"${ext(url)}>${esc(p.cta === 'app' ? d.openApp : d.open)} ${ARROW}</a>`;
}

function render() {
  const d = T[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  $('b-pt').setAttribute('aria-pressed', lang === 'pt');
  $('b-en').setAttribute('aria-pressed', lang === 'en');
  ['n-proj','n-about','n-contact'].forEach((id, i) => $(id).textContent = d.nav[i]);
  $('h1').innerHTML = d.h1;
  $('intro').textContent = d.intro;
  $('a-proj').textContent = d.aProj;
  $('a-contact').textContent = d.aContact;
  $('role').textContent = d.role;
  $('areas').innerHTML = d.areas.map(a => `<span>${esc(a)}</span>`).join('');
  $('t-proj').textContent = d.tProj;
  $('p-proj').textContent = d.pProj;
  $('projects').innerHTML = d.projects.map((p, i) => `
    <article class="card">
      ${shot(p)}
      <div class="body">
        <div class="row"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="pill ${p.pill === 'pub' ? 'live' : p.pill}">${esc(d.pills[p.pill])}</span></div>
        <h3>${esc(p.t)}</h3>
        <p class="sub">${esc(p.sub)}</p>
        <p>${esc(p.what)}</p>
        <ul class="hl">${p.hl.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
        <div class="stack">${p.stack.map(s => `<span>${esc(s)}</span>`).join('')}</div>
      </div>
      <div class="foot"><small>${esc(p.note)}</small>${cta(p, d)}</div>
    </article>`).join('');
  $('t-about').textContent = d.tAbout;
  $('about').innerHTML = d.about.map(p => `<p>${esc(p)}</p>`).join('');
  $('t-edu').textContent = d.tEdu;
  $('edu').innerHTML = d.edu.map(([y, c, w]) => `<li><span class="y">${esc(y)}</span><div><b>${esc(c)}</b><span>${esc(w)}</span></div></li>`).join('');
  $('skills').innerHTML = d.skills.map(([g, list]) => `<div><span class="k">${esc(g)}</span><div class="skills">${list.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>`).join('');
  $('t-contact').textContent = d.tContact;
  $('copy').textContent = d.copy;
  $('fine').textContent = d.fine;
  $('foot').textContent = d.foot;
}

function setLang(l) { lang = l; try { localStorage.setItem('pf-lang', l); } catch (e) {} render(); }
$('b-pt').addEventListener('click', () => setLang('pt'));
$('b-en').addEventListener('click', () => setLang('en'));
$('copy').addEventListener('click', () => {
  const btn = $('copy'), el = $('mail');
  const ok = () => { btn.textContent = T[lang].copied; setTimeout(() => { btn.textContent = T[lang].copy; }, 1600); };
  const fb = () => { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = T[lang].sel; };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.textContent).then(ok, fb); else fb(); } catch (e) { fb(); }
});
render();
</script>
</body>
</html>
